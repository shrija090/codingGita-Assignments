<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
  
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }

      body {
        background-color: #111;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      .app {
        background-color: white;
        width: 100%;
        max-width: 800px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px;
        border: 4px solid black;
      }

      .header {
        display: flex;
        flex-direction: column; 
        gap: 10px;
      }

      .header h2 {
        border: 4px solid black;
        text-align: center;
        padding: 20px;
        text-transform: uppercase;
      }

      .header nav {
        border: 4px solid black;
        display: flex;
        justify-content: center;
        gap: 20px;
        padding: 15px;
      }

      .header nav a {
        text-decoration: none;
        color: black;
        font-weight: bold;
        text-transform: uppercase;
      }

      .main {
        display: flex;
    
        flex-direction: row-reverse;
        gap: 10px;
        min-height: 400px;
      }

      .content {
        flex: 2; 
        border: 4px solid black;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
      }

      .sidebar {
        flex: 1; 
        border: 4px solid black;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 20px;
      }

      
      .footer {
        border: 4px solid black;
        text-align: center;
        padding: 20px;
        font-weight: bold;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h2>HEADER</h2>

        <nav>
          <a href="#">Home</a>
          <a href="#">About</a>
          <a href="#">Services</a>
          <a href="#">Contact</a>
        </nav>
      </header>

      <main class="main">
        <aside class="sidebar">
          <h3>Categories</h3>
          <p>Web Development</p>
          <p>Design</p>
          <p>Programming</p>
        </aside>

        <section class="content">
          <h1>Welcome to MyApp</h1>
          <p>Learn and build amazing projects.</p>
        </section>
      </main>

      <footer class="footer">
        <p>© 2026 MyApp</p>
      </footer>
    </div>
  </body>
</html>
