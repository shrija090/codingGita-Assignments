<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navigation Bar</title>
    <style>
      * {
        box-sizing: border-box;
      }

      .navbar {
        display: flex; 
        justify-content: space-between; 
        align-items: center;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        width: 100%;
        height: 80px;
        padding: 0 30px;
        color: black;
      }

      .logo {
        font-size: 26px;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        font-weight: bold;
      }

      .nav-links {
        display: flex; 
        list-style: none; 
        padding: 0;
        margin: 0;
        font-size: 18px;
        gap: 25px; 
      }

      .text {
        color: blue;
      }
      
      .auth-buttons {
        display: flex; 
        gap: 10px;
      }

      button {
        font-size: 18px;
        padding: 10px 18px;
      }

      .btn {
        border: none;
        border-radius: 5px;
        background-color: rgb(64, 0, 255);
        color: white;
      }
    </style>
  </head>
  <body>
    <header class="navbar">
      <div class="logo">🔵 Lōgo</div>

      <ul class="nav-links">
        <li>About</li>
        <li>Solutions ▾</li>
        <li class="text">Resources</li>
        <li>Pricing</li>
        <li>Contact</li>
      </ul>

      <div class="auth-buttons">
        <button>Login</button>
        <button class="btn">Button</button>
      </div>
    </header>
  </body>
</html>
