<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kidz World</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: black;
            background-color: white;
        }

        .top {
            height: 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
        }

        .top h2 {
            font-size: 20px;
            margin: 0;
        }

        .top p {
            font-size: 16px;
            font-weight: bold;
            margin: 0;
        }

        .banner {
            height: 300px;
            background-image: url("https://github.com/codinggita/CGxSU_Semester_1/blob/main/Semester_1/html_css_js(sem_01)/CSS/00.assignment/02.level_2/07.kidz-world/assets/kw-background.png?raw=true");
            background-size: cover;

            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            padding-left: 40px;
        }

        .text h1 {
            color: white;
            font-family: Georgia, serif;
            font-size: 50px;
            line-height: 1.25 ;
            margin: 0 0 8px;
        }

        .text h4 {
            color: white;
            font-size: 12px;
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="top">
        <h2>KIDZ WORLD</h2>
        <p>🛒 Cart items (0)</p>
    </div>

    <div class="banner">

        <div class="text">
            <h1>Shop.<br>Have Fun.<br>Repeat.</h1>
            <h4>#NewAndNow</h4>
        </div>
    </div>
    <div class="books">
        <h3>Discover New Books</h3>

        <div class="cards">

            <div class="card">
                <img src="https://github.com/codinggita/CGxSU_Semester_1/blob/main/Semester_1/html_css_js(sem_01)/CSS/00.assignment/02.level_2/07.kidz-world/assets/book1.png?raw=true"
                    alt="This was our pact">
                <h4>This was our pact</h4>
                <p>Ryan Andrews</p>
                <div class="price"><b>$7.49</b><button>Add 🛒</button></div>
            </div>


            <div class="card">
                <img src="https://github.com/codinggita/CGxSU_Semester_1/blob/main/Semester_1/html_css_js(sem_01)/CSS/00.assignment/02.level_2/07.kidz-world/assets/book2.png?raw=true" alt="The famous five">
                <h4>The famous five</h4>
                <p>Enid Blyton</p>
                <div class="price"><b>$4.59</b><button>Add 🛒</button></div>
            </div>

            <div class="card">
                <img src="https://github.com/codinggita/CGxSU_Semester_1/blob/main/Semester_1/html_css_js(sem_01)/CSS/00.assignment/02.level_2/07.kidz-world/assets/book3.png?raw=true" alt="Matilda">
                <h4>Matilda</h4>
                <p>Roald Dahl</p>
                <div class="price"><b>$6.80</b><button>Add 🛒</button></div>
            </div>

            <div class="card">
                <img src="https://github.com/codinggita/CGxSU_Semester_1/blob/main/Semester_1/html_css_js(sem_01)/CSS/00.assignment/02.level_2/07.kidz-world/assets/book4.png?raw=true" alt="Harry Potter">
                <h4>Harry Potter</h4>
                <p>JK Rowling</p>
                <div class="price"><b>$10</b><button>Add 🛒</button></div>
            </div>

            <div class="card">
                <img src="https://github.com/codinggita/CGxSU_Semester_1/blob/main/Semester_1/html_css_js(sem_01)/CSS/00.assignment/02.level_2/07.kidz-world/assets/book5.png?raw=true" alt="For Young Readers">
                <h4>For Young Readers</h4>
                <p>Ruskin Bond</p>
                <div class="price"><b>$7.29</b><button>Add 🛒</button></div>
            </div>

            <div class="card">
                <img src="https://github.com/codinggita/CGxSU_Semester_1/blob/main/Semester_1/html_css_js(sem_01)/CSS/00.assignment/02.level_2/07.kidz-world/assets/book6.png?raw=true" alt="Wimpy Kid DIY">
                <h4>Wimpy Kid - DIY</h4>
                <p>Jeff Kinney</p>
                <div class="price"><b>$4.99</b><button>Add 🛒</button></div>
            </div>

        </div>
    </div>



</body>

</html>
